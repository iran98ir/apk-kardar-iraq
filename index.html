<script>
(function(){
  var btn = document.querySelector('.btn-inline');
  var repo = 'iran98ir/app.down';

  // 1) از API گیت‌هاب آخرین ریلیز را می‌گیریم
  fetch('https://api.github.com/repos/' + repo + '/releases/latest', {
    headers: { 'Accept': 'application/vnd.github+json' }
  })
  .then(function(r){
    if (!r.ok) throw new Error('API error');
    return r.json();
  })
  .then(function(data){
    // 2) اولین فایل APK را از لیست asset ها انتخاب می‌کنیم (هر اسمی که باشد)
    var apk = (data.assets || []).find(function(a){
      return /\.apk$/i.test(a.name);
    });
    if (apk) {
      btn.href = apk.browser_download_url;   // لینک مستقیم دانلود
      btn.setAttribute('download', apk.name); // نام فایل هر چه بود
      // به‌روزرسانی نمایش نسخه
      var vEl = document.querySelector('.version b');
      if (vEl && data.tag_name) vEl.textContent = data.tag_name.replace(/^v/i,'');
      var verMini = document.querySelector('.stat-mini .val');
      if (verMini && data.tag_name) verMini.textContent = data.tag_name.replace(/^v/i,'');
    } else {
      btn.href = 'https://github.com/' + repo + '/releases/latest';
    }
  })
  .catch(function(){
    // اگر API جواب نداد (مثلاً rate limit)، به صفحه آخرین ریلیز می‌فرستیم
    btn.href = 'https://github.com/' + repo + '/releases/latest';
  });
})();
</script>
